name: CI (stay-client-bff)
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint:ci
      - run: yarn type-check
      - run: yarn build
      - run: yarn test
      - run: yarn test:e2e
      - name: Docker image
        run: docker build -t stay-client-bff:ci .
